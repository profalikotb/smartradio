name: stream-probe
on:
  push:
    branches: [stream-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y ffmpeg jq >/dev/null
      - name: probe
        run: |
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"
          probe() {
            u="$1"
            h=$(curl -sS -L -m 12 -r 0-4000 -o /tmp/b -w "%{http_code} %{content_type}" -A "$UA" "$u" 2>&1 | tail -1)
            d=$(timeout 25 ffmpeg -hide_banner -nostdin -user_agent "$UA" -t 8 -i "$u" -f null - 2>&1 | grep -oE "Audio: [a-z0-9]+|time=[0-9:.]+" | tail -2 | tr '\n' ' ')
            echo "PROBE $u => HTTP $h => DECODE ${d:-FAILED}"
          }
          for page in "https://www.radiomasr.net/live-stream/" "https://www.radiomasr.net/live/"; do
            echo "--- $page"
            curl -sS -L -m 20 -A "$UA" "$page" -o /tmp/p -w "HTTP %{http_code}\n" | tail -1
            grep -oiE "(https?:)?//[^\"' <>()]+" /tmp/p | grep -viE "\.(css|png|jpe?g|gif|svg|woff2?|ico)([?#]|$)|fonts\.|gravatar|wp-json|xmlrpc|/feed|wp-includes|facebook\.com/sharer|twitter\.com/share" | sort -u | head -60
            echo "--- media/player lines"
            grep -iE "mp3|m3u8|aac|stream|setMedia|jPlayer|<audio|<source|<iframe|radiojar|zeno|shoutcast|icecast" /tmp/p | sed 's/^[[:space:]]*//' | cut -c1-300 | head -30
          done
          for u in $(grep -ohiE "https?://[^\"' <>()]+" /tmp/p | grep -iE "\.m3u8|\.mp3|\.aac|/stream|:[0-9]{4}|radiojar|zeno|live" | grep -viE "\.(css|js|png|jpe?g)" | sort -u | head -10); do probe "$u"; done
