name: stream-probe
on:
  push:
    branches: [stream-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y ffmpeg jq >/dev/null
      - name: probe
        run: |
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"
          probe() {
            u="$1"
            h=$(curl -sS -L -m 12 -r 0-4000 -o /tmp/b -w "%{http_code} %{content_type}" -A "$UA" "$u" 2>&1 | tail -1)
            d=$(timeout 25 ffmpeg -hide_banner -nostdin -user_agent "$UA" -t 8 -i "$u" -f null - 2>&1 | grep -oE "Audio: [a-z0-9]+|time=[0-9:.]+" | tail -2 | tr '\n' ' ')
            echo "PROBE $u => HTTP $h => DECODE ${d:-FAILED}"
          }
          echo "=== Egypt directory entries matching masr/misr/nile/مصر/النيل"
          curl -sS -m 30 -A "SmartRadioProbe/1.0" "https://de1.api.radio-browser.info/json/stations/bycountrycodeexact/EG?hidebroken=false&limit=2000" \
            | jq -r '.[] | [.name, .codec, (.bitrate|tostring), (.lastcheckok|tostring), .homepage, .url_resolved] | @tsv' \
            | grep -iE "masr|misr|nile|مصر|النيل|news|اخبار|أخبار" | tee /tmp/eg
          cut -f6 /tmp/eg | sort -u | head -15 | while read -r u; do [ -n "$u" ] && probe "$u"; done
          echo "=== official pages: stream-looking URLs"
          for page in "https://www.radiomasr.net/" "https://radiomasr.net/" "https://www.radiomasr.net/live" "https://www.nile.eg/" "https://www.nile.eg/live" "https://www.maspero.eg/radio" "https://www.maspero.eg/live"; do
            echo "--- $page"
            curl -sS -L -m 20 -A "$UA" "$page" -o /tmp/p -w "HTTP %{http_code} %{url_effective}\n" 2>&1 | tail -1
            grep -oiE "(https?:)?//[^\"' <>()]+(\.m3u8|\.mp3|\.aac|/stream|/live[^\"' <>]*|radiojar[^\"' <>]*|zeno\.fm[^\"' <>]*|streamtheworld[^\"' <>]*|:[0-9]{4}/[^\"' <>]*|dailymotion[^\"' <>]*|youtube\.com/embed[^\"' <>]*|player[^\"' <>]*)" /tmp/p | sort -u | head -25
          done
          echo "=== candidate radiomasr hosts"
          for u in "https://stream.radiojar.com/radiomasr" "https://radiomasr.net/live" "https://live.radiomasr.net/" "https://stream.radiomasr.net/" ; do probe "$u"; done
          getent hosts live.radiomasr.net radiomasr.net www.radiomasr.net || echo "DNS: some hosts do not resolve"
